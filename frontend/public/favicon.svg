<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Shell -->
  <ellipse cx="32" cy="54" rx="22" ry="13" fill="#166534"/>
  <ellipse cx="32" cy="52" rx="18" ry="11" fill="#16a34a"/>
  <ellipse cx="32" cy="50" rx="9" ry="6" fill="#15803d" opacity="0.5"/>
  <ellipse cx="20" cy="54" rx="6" ry="4" fill="#15803d" opacity="0.4"/>
  <ellipse cx="44" cy="54" rx="6" ry="4" fill="#15803d" opacity="0.4"/>

  <!-- Neck -->
  <ellipse cx="32" cy="39" rx="7" ry="6" fill="#4ade80"/>

  <!-- Left arm -->
  <ellipse cx="13" cy="45" rx="5" ry="9" fill="#4ade80" transform="rotate(-15 13 45)"/>
  <!-- Right arm -->
  <ellipse cx="51" cy="45" rx="5" ry="9" fill="#4ade80" transform="rotate(15 51 45)"/>

  <!-- Head -->
