  <!-- Left eye -->
  <circle cx="25" cy="20" r="5" fill="white"/>
  <circle cx="26" cy="20" r="3" fill="#1a1a2e"/>
  <circle cx="25" cy="19" r="1.2" fill="white"/>

  <!-- Right eye -->
  <circle cx="39" cy="20" r="5" fill="white"/>
  <circle cx="40" cy="20" r="3" fill="#1a1a2e"/>
  <circle cx="39" cy="19" r="1.2" fill="white"/>

  <!-- Nose -->
